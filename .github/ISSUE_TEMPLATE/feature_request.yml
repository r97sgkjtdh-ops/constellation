name: Proposer une idée
description: Une fonctionnalité ou une amélioration.
labels: ["amélioration"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Le besoin
      description: Ce que tu cherches à faire, et ce qui te gêne aujourd'hui.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Ce que tu proposes
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Ce que tu as essayé à la place
